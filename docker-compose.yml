services:
  db:
    image: postgres:16-alpine
    container_name: physical-bgc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: physical
      POSTGRES_PASSWORD: physical_local_only
      POSTGRES_DB: physical_bgc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physical -d physical_bgc"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
